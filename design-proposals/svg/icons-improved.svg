</svg>

<!-- COPY -->
<svg id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="8" y="8" width="13" height="13" rx="2"/>
  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
</svg>

<!-- HOME -->
<svg id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 10l9-7 9 7v11H3z"/>
  <path d="M9 21v-7h6v7"/>
</svg>

<!-- PHONE -->
<svg id="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 4h3l1.5 4.5-2.3 1.5c.8 1.5 1.8 2.8 3.3 3.5L13 11l4 1.5v3.5c0 1.1-.9 2-2 2-7.7 0-14-6.3-14-14C1 2.9 1.9 2 3 2h3z"/>
</svg>

<!-- MESSAGE (chat bubble) -->
<svg id="message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 12a9 9 0 0 1-9 9c-1.5 0-2.9-.4-4.1-1L3 21l1.1-4.9A9 9 0 1 1 21 12z"/>
  <path d="M9 11h6M9 14h4"/>
</svg>

<!-- GLOBE -->
<svg id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/>
  <path d="M3 12h18M12 3c2.2 2.2 3.2 5.2 3.2 9s-1 6.8-3.2 9c-2.2-2.2-3.2-5.2-3.2-9s1-6.8 3.2-9z"/>
</svg>

<!-- CAMERA -->
<svg id="camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="6" width="20" height="14" rx="2"/>
  <circle cx="12" cy="13" r="3.5"/>
  <path d="M7 6l1-2h8l1 2"/>
</svg>

<!-- MAIL -->
<svg id="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <path d="M3 7l9 6 9-6"/>
</svg>

<!-- CLOCK -->
<svg id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 6v6l3.5 2"/>
</svg>

<!-- CAKE -->
<svg id="cake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="13" width="16" height="8" rx="1"/>
  <path d="M4 13c1.5 1.5 3 1.5 5 0s3.5-1.5 5 0 3.5 1.5 5 0M12 13V9M12 6.5c.6-.6.9-1.2.9-1.8 0-.8-.6-1.2-.9-1.2s-.9.4-.9 1.2c0 .6.3 1.2.9 1.8z"/>
