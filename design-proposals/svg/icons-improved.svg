</svg>

<!-- MAP (location pin) -->
<svg id="map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3c-3.3 0-6 2.7-6 6 0 5.2 6 12 6 12s6-6.8 6-12c0-3.3-2.7-6-6-6z"/>
