</svg>

<!-- BALLOON -->
<svg id="balloon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3c-2.8 0-5 2.5-5 5.5S9 14 12 14s5-2.5 5-5.5S14.8 3 12 3z"/>
  <path d="M12 14l-.8 1.5c-.3.5-.3 1 0 1.5l.3.5c.2.4.5.6.9.6.4 0 .7-.2.9-.6l.3-.5c.3-.5.3-1 0-1.5L12 14z"/>
  <path d="M12 18v3M10 21h4"/>
</svg>

<!-- SPARKLE (celebration) -->
<svg id="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5zM18 16l1 2.5 2.5 1-2.5 1L18 23l-1-2.5-2.5-1 2.5-1L18 16z"/>
</svg>
