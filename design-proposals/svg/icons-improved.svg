</svg>

<!-- ALERT (warning triangle) -->
<svg id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3L3 20h18L12 3z"/>
  <path d="M12 9v5M12 16.5h.01"/>
</svg>

<!-- ARROW -->
<svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
