</svg>

<!-- CALENDAR -->
<svg id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="5" width="16" height="16" rx="2"/>
  <path d="M4 10h16M8 3v4M16 3v4"/>
</svg>

<!-- USERS -->
<svg id="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="9" cy="9" r="3"/>
  <path d="M3 20c0-3 2.7-5 6-5s6 2 6 5M16.5 11c1.4 0 2.5-1.1 2.5-2.5S17.9 6 16.5 6M18 16c2.2 0 4 1.5 4 3.5"/>
</svg>

<!-- PRINTER -->
<svg id="printer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 8V3h10v5M6 15H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 12h10v9H7z"/>
</svg>

<!-- DOWNLOAD -->
<svg id="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3v13M8 12l4 4 4-4M4 20h16"/>
</svg>

<!-- UPLOAD -->
<svg id="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 18V5M8 9l4-4 4 4M4 20h16"/>
</svg>

<!-- PLUS -->
<svg id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <path d="M12 5v14M5 12h14"/>
</svg>

<!-- TRASH -->
<svg id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 6h18M9 6V4h6v2M8 6v13c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2V6"/>
</svg>

<!-- INFO -->
