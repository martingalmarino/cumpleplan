<!-- Improved icon set for Festejito -->
<!-- Each icon follows a consistent 24x24 grid with 2px stroke, rounded caps -->

<!-- MENU -->
<svg id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <path d="M3 7h18M3 12h18M3 17h18"/>
</svg>

<!-- UTENSILS (fork & knife) -->
<svg id="utensils" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 3v7c0 1.1.9 2 2 2M8 12v9M6 3c0 3 0 6 0 7M16 3v18M16 3c-.8 1.5-1.2 3.5-1.2 5.5 0 1.1.5 2 1.2 2.5"/>
</svg>

<!-- WALLET -->
<svg id="wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="7" width="18" height="13" rx="2"/>
  <path d="M3 10h18M7 7L8 4h8l1 3M17 13h2"/>
</svg>

<!-- CHECK -->
<svg id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 13l4 4L19 7"/>
</svg>

<!-- BAG (shopping) -->
<svg id="bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
